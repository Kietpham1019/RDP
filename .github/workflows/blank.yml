name: RDP-DucThangTechDzVPS-WinServer2025-ZeroLag-6Hours

on:
  workflow_dispatch:
    inputs:
      ngrok_download_url:
        description: 'Ngrok Windows (amd64) ZIP direct link'
        required: true
        default: 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip'
      ngrok_region:
        description: 'Ngrok Region (ap = Singapore, us = US, eu = Europe)'
        required: false
        default: 'ap'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup UTF-8 & Environment
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ErrorActionPreference = "Continue"
          Write-Host "✓ Environment sẵn sàng"

      # ============================================================
      # 1. DOWNLOAD NGROK
      # ============================================================
      - name: Download & Extract Ngrok
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "${{ github.event.inputs.ngrok_download_url }}" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath ngrok -Force
          Write-Host "✓ Ngrok đã sẵn sàng"

      - name: Authenticate Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if (-not $Env:NGROK_AUTH_TOKEN) {
            Write-Error "❌ Thiếu secret NGROK_AUTH_TOKEN!"
            exit 1
          }
          .\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
          Write-Host "✓ Ngrok đã xác thực"

      # ============================================================
      # 2. ĐỔI TÊN VPS
      # ============================================================
      - name: Đổi tên VPS
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vpsName = "DucThangTechDzVPS"
          Write-Host "→ Đang đổi tên VPS thành: $vpsName"
          
          Rename-Computer -NewName $vpsName -Force -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName" -Name "ComputerName" -Value $vpsName -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName" -Name "ComputerName" -Value $vpsName -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "Hostname" -Value $vpsName -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "NV Hostname" -Value $vpsName -Force -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" -Name "RegisteredOwner" -Value "DucThangTechDz" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" -Name "RegisteredOrganization" -Value "DucThangTechDz VPS" -Force -ErrorAction SilentlyContinue
          
          Write-Host "✓ Đã đổi tên VPS thành: $vpsName"

      # ============================================================
      # 2b. BẬT RDP
      # ============================================================
      - name: Bật RDP & Firewall
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "AllowTSConnections" -Value 1 -Force -ErrorAction SilentlyContinue
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-TCP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Write-Host "✓ RDP đã bật"

      # ============================================================
      # 2c. TẠO USER
      # ============================================================
      - name: Tạo User & Phân quyền
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          
          $username = "DucthengTechDz"
          $password = "W1nd0ws-P4ssw0rd-2026!"
          $secPass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $username -Password $secPass -ErrorAction SilentlyContinue
              Write-Host "✓ User $username đã tồn tại, đã cập nhật mật khẩu"
          } else {
              New-LocalUser -Name $username -Password $secPass -FullName $username -PasswordNeverExpires -AccountNeverExpires -ErrorAction SilentlyContinue
              Write-Host "✓ Đã tạo user $username"
          }
          
          $rdpMembers = Get-LocalGroupMember -Group "Remote Desktop Users" -ErrorAction SilentlyContinue
          if (-not ($rdpMembers | Where-Object { $_.Name -like "*$username" })) {
              try {
                  Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction Stop
                  Write-Host "✓ Đã thêm $username vào Remote Desktop Users"
              } catch {
                  Write-Host "⚠️ Không thêm được vào Remote Desktop Users: $_"
              }
          } else {
              Write-Host "✓ $username đã có trong Remote Desktop Users"
          }
          
          $adminMembers = Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue
          if (-not ($adminMembers | Where-Object { $_.Name -like "*$username" })) {
              try {
                  Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction Stop
                  Write-Host "✓ Đã thêm $username vào Administrators"
              } catch {
                  Write-Host "⚠️ Không thêm được vào Administrators: $_"
              }
          } else {
              Write-Host "✓ $username đã có trong Administrators"
          }
          
          Write-Host "✓ User: $username / Pass: $password"

      # ============================================================
      # 3. DEBLOAT WINDOWS SERVER 2025
      # ============================================================
      - name: Windows Server 2025 - Debloat
        shell: pwsh
        run: |
          Write-Host "===== DEBLOAT WINDOWS SERVER 2025 ====="
          $ErrorActionPreference = "Continue"
          
          $keepApps = @(
              "Microsoft.WindowsStore", "Microsoft.StorePurchaseApp",
              "Microsoft.WindowsTerminal", "Microsoft.VCLibs",
              "Microsoft.NET", "Microsoft.UI.Xaml",
              "Microsoft.DesktopAppInstaller", "Microsoft.Services.Store.Engagement"
          )
          
          # Xóa từng gói riêng biệt, bọc try/catch để tránh crash
          $packages = Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue
          foreach ($pkg in $packages) {
              $name = $pkg.Name
              $shouldKeep = $false
              foreach ($keep in $keepApps) {
                  if ($name -like "*$keep*") { $shouldKeep = $true; break }
              }
              if ($shouldKeep) { continue }
              
              try {
                  Remove-AppxPackage -Package $pkg.PackageFullName -AllUsers -ErrorAction SilentlyContinue
              } catch { }
          }
          
          # Xóa provisioned packages
          $provPkgs = Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue
          foreach ($pkg in $provPkgs) {
              $name = $pkg.DisplayName
              $shouldKeep = $false
              foreach ($keep in $keepApps) {
                  if ($name -like "*$keep*") { $shouldKeep = $true; break }
              }
              if ($shouldKeep) { continue }
              
              try {
                  Remove-AppxProvisionedPackage -Online -PackageName $pkg.PackageName -ErrorAction SilentlyContinue
              } catch { }
          }
          
          # Tắt IE Enhanced Security Configuration
          $adminKey = "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}"
          $userKey = "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A8-37EF-4b3f-8CFC-4F3A74704073}"
          Set-ItemProperty -Path $adminKey -Name "IsInstalled" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $userKey -Name "IsInstalled" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Stop-Process -Name Explorer -Force -ErrorAction SilentlyContinue
          
          # Tắt Server Manager auto-start
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\ServerManager" -Name "DoNotOpenServerManagerAtLogon" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Tắt Shutdown Event Tracker
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Reliability" -Name "ShutdownReasonOn" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Write-Host "✓ Debloat hoàn tất"

      # ============================================================
      # 4. CÀI CHROME + 7-ZIP
      # ============================================================
      - name: Cài đặt Chrome & 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $temp = $env:TEMP
          
          Write-Host "→ Đang cài Google Chrome..."
          $chromeInstaller = "$temp\chrome_installer.exe"
          Invoke-WebRequest "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromeInstaller
          Start-Process -FilePath $chromeInstaller -Args "/silent /install" -Wait
          Remove-Item $chromeInstaller -Force -ErrorAction SilentlyContinue
          
          Write-Host "→ Đang cài 7-Zip..."
          $sevenZip = "$temp\7z-installer.exe"
          Invoke-WebRequest "https://www.7-zip.org/a/7z2408-x64.exe" -OutFile $sevenZip
          Start-Process -FilePath $sevenZip -Args "/S" -Wait
          Remove-Item $sevenZip -Force -ErrorAction SilentlyContinue
          
          Write-Host "✓ Chrome & 7-Zip đã cài xong"

      # ============================================================
      # 5. TỐI ƯU MẠNG - ZERO LAG
      # ============================================================
      - name: Tối ưu Mạng - Zero Delay - Zero Lag
        shell: pwsh
        run: |
          Write-Host "===== TỐI ƯU MẠNG - ZERO LAG ====="
          $ErrorActionPreference = "Continue"
          
          # ---------- TCP/IP STACK ----------
          netsh int tcp set global autotuninglevel=normal | Out-Null
          netsh int tcp set global rss=enabled | Out-Null
          netsh int tcp set global chimney=disabled | Out-Null
          netsh int tcp set global ecncapability=enabled | Out-Null
          netsh int tcp set global timestamps=disabled | Out-Null
          netsh int tcp set global netdma=enabled | Out-Null
          netsh int tcp set global dca=enabled | Out-Null
          netsh int tcp set global rsc=enabled | Out-Null
          netsh int tcp set heuristics disabled | Out-Null
          netsh int tcp set supplemental Internet congestionprovider=ctcp | Out-Null
          
          # ---------- TCP REGISTRY - GIẢM DELAY ----------
          $tcp = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters"
          $tcpIf = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces"
          
          Set-ItemProperty -Path $tcp -Name "TcpAckFrequency" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TCPNoDelay" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TcpDelAckTicks" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TcpWindowSize" -Value 65535 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "Tcp1323Opts" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "DefaultTTL" -Value 64 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "EnableTCPA" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tcp -Name "MaxUserPort" -Value 65534 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TcpTimedWaitDelay" -Value 30 -Type DWord -Force
          
          # Áp dụng cho TẤT CẢ network interfaces
          Get-ChildItem $tcpIf -ErrorAction SilentlyContinue | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name "TcpAckFrequency" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "TCPNoDelay" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "TcpDelAckTicks" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          
          # ---------- QoS CHO RDP ----------
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Version" -Value "1.0" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Application Name" -Value "*.exe" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Protocol" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Local Port" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Local IP" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Remote Port" -Value "3389" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Remote IP" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "DSCP Value" -Value "46" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Throttle Rate" -Value "-1" -Type String -Force
          
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Psched" -Name "NonBestEffortLimit" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # ---------- MULTIMEDIA NETWORK THROTTLING ----------
          $mmPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          Set-ItemProperty -Path $mmPath -Name "NetworkThrottlingIndex" -Value 0xffffffff -Type DWord -Force
          Set-ItemProperty -Path $mmPath -Name "SystemResponsiveness" -Value 0 -Type DWord -Force
          
          $netTasks = @("Audio", "Video", "Games", "Low Latency", "Pro Audio", "Window Manager", "Capture", "DisplayPostProcessing", "Playback")
          foreach ($task in $netTasks) {
              $p = "$mmPath\Tasks\$task"
              if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
              Set-ItemProperty -Path $p -Name "Scheduling Category" -Value "High" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $p -Name "SFIO Priority" -Value "High" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $p -Name "Priority" -Value 6 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $p -Name "GPU Priority" -Value 8 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          
          # ---------- DISABLE DEFENDER NETWORK INSPECTION ----------
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableRealtimeMonitoring" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableBehaviorMonitoring" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableScanOnRealtimeEnable" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet" -Name "SpynetReporting" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # Tắt Firewall
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue
          
          # ---------- DNS TỐI ƯU ----------
          $adapters = Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq "Up" }
          foreach ($adapter in $adapters) {
              Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses ("1.1.1.1", "8.8.8.8", "1.0.0.1") -ErrorAction SilentlyContinue
          }
          
          # ---------- DISABLE NETWORK SERVICES NGỐN TÀI NGUYÊN ----------
          $netServices = @("SNMPTRAP", "SNMP", "RemoteAccess", "SharedAccess", "WlanSvc")
          foreach ($svc in $netServices) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          Write-Host "✓ Đã tối ưu mạng - Zero Delay đã bật"

      # ============================================================
      # 6. TỐI ƯU RDP - ZERO LAG
      # ============================================================
      - name: Tối ưu RDP - Zero Lag
        shell: pwsh
        run: |
          Write-Host "===== TỐI ƯU RDP - ZERO LAG ====="
          $ErrorActionPreference = "Continue"
          
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          
          # Graphics
          Set-ItemProperty -Path $tsPath -Name "AVC444ModePreferred" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "bEnumerateHWBeforeSW" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "EnableRemoteFXAdvancedRemoteApp" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPath -Name "CompressionEnabled" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPath -Name "SelectTransport" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "VisualExperiencePolicy" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fEnableFontSmoothing" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fEnableDesktopComposition" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # RDP-Tcp endpoint
          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          
          Set-ItemProperty -Path $rdpTcp -Name "ColorDepth" -Value 4 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "fLowBandwidth" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "fDisableCam" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "fDisableAudioCapture" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "MinEncryptionLevel" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "fSingleSessionPerUser" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdpTcp -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "MaxIdleTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "MaxConnectionTime" -Value 0 -Type DWord -Force
          
          # Timeout policies
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxConnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "KeepAliveInterval" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "KeepAliveEnable" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fResetBroken" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path $tsPath -Name "DisableRemoteAppPublishing" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # UDP transport
          Set-ItemProperty -Path $tsPath -Name "SelectTransport" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "UDPTransport" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          
          Write-Host "✓ Đã tối ưu RDP - Zero Lag"

      # ============================================================
      # 7. ECO MODE
      # ============================================================
      - name: ECO Mode - Tối ưu tài nguyên
        shell: pwsh
        run: |
          Write-Host "===== ECO MODE ====="
          $ErrorActionPreference = "Continue"
          
          $servicesToDisable = @(
              "SysMain", "DiagTrack", "dmwappushservice",
              "WSearch", "Spooler", "Fax", "RemoteRegistry",
              "MapsBroker", "RetailDemo", "WMPNetworkSvc",
              "XblAuthManager", "XblGameSave", "XboxNetApiSvc",
              "XboxGipSvc", "PhoneSvc", "PrintNotify",
              "Themes", "TabletInputService", "WerSvc",
              "TrkWks", "WpnService", "WbioSrvc"
          )
          foreach ($svc in $servicesToDisable) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          Stop-Service -Name "wuauserv" -Force -ErrorAction SilentlyContinue
          Stop-Service -Name "BITS" -Force -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Name "AllowTelemetry" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # Visual effects
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "EnableTransparency" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # RAM
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters" -Name "EnablePrefetcher" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters" -Name "EnableSuperfetch" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "LargeSystemCache" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "DisablePagingExecutive" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "ClearPageFileAtShutdown" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # Dọn rác
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          Dism.exe /online /Cleanup-Image /StartComponentCleanup /ResetBase 2>&1 | Out-Null
          
          # Power
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0
          powercfg /change disk-timeout-ac 0
          powercfg /change disk-timeout-dc 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change hibernate-timeout-dc 0
          powercfg /hibernate off
          
          powercfg /requestsoverride PROCESS svchost.exe System
          powercfg /requestsoverride DRIVER srvnet System
          powercfg /requestsoverride SERVICE TermService System
          
          Write-Host "✓ ECO Mode đã kích hoạt"

      # ============================================================
      # 8. TẮT DEFENDER REAL-TIME
      # ============================================================
      - name: Tắt Windows Defender Real-time
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
              Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
              Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
              Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue
              Set-MpPreference -MAPSReporting Disabled -ErrorAction SilentlyContinue
              Set-MpPreference -SubmitSamplesConsent NeverSend -ErrorAction SilentlyContinue
              Write-Host "✓ Defender real-time đã tắt"
          } catch {
              Write-Host "⚠️ Không thể tắt Defender: $_"
          }

      # ============================================================
      # 9. START NGROK & KEEP-ALIVE 6H
      # ============================================================
      - name: Start Ngrok & Keep-Alive (6 Hours)
        shell: pwsh
        run: |
          Write-Host "======================================================================"
          Write-Host "  🖥️  VPS: DucThangTechDzVPS"
          Write-Host "  🚀 WINDOWS SERVER 2025 - SUPER FAST - ZERO LAG"
          Write-Host "======================================================================"
          Write-Host "  Tài khoản : DucthengTechDz"
          Write-Host "  Mật khẩu  : W1nd0ws-P4ssw0rd-2026!"
          Write-Host "  VPS Name  : DucThangTechDzVPS"
          Write-Host "  Region    : ${{ github.event.inputs.ngrok_region }} (Singapore)"
          Write-Host "  Tối ưu    : Network Zero-Lag, RDP Zero-Lag, QoS, TCP NoDelay"
          Write-Host "  Thời gian : 6 TIẾNG (360 PHÚT)"
          Write-Host "======================================================================"
          
          $region = "${{ github.event.inputs.ngrok_region }}"
          
          $ngrokProcess = Start-Process -FilePath ".\ngrok\ngrok.exe" `
              -ArgumentList "tcp 3389 --region=$region --log=stdout --log-format=json" `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput "$env:TEMP\ngrok_out.log" `
              -RedirectStandardError "$env:TEMP\ngrok_err.log"
          
          Write-Host "⏳ Đợi Ngrok khởi động..."
          Start-Sleep -Seconds 15
          
          $publicUrl = $null
          for ($i = 0; $i -lt 5; $i++) {
              try {
                  $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
                  $publicUrl = $tunnels.tunnels[0].public_url
                  if ($publicUrl) { break }
              } catch { }
              Start-Sleep -Seconds 5
          }
          
          if ($publicUrl) {
              Write-Host "======================================================================"
              Write-Host "  🌐 ĐỊA CHỈ RDP: $publicUrl" -ForegroundColor Green
              Write-Host "  📌 Copy phần sau 'tcp://' vào Remote Desktop" -ForegroundColor Yellow
              Write-Host "  📌 Hoặc dùng: $($publicUrl -replace 'tcp://', '')" -ForegroundColor Yellow
              Write-Host "======================================================================"
          } else {
              Write-Host "⚠️ Không lấy được URL. Log Ngrok:"
              Get-Content "$env:TEMP\ngrok_out.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
          
          Write-Host "🕐 Bắt đầu giữ kết nối 6 tiếng..."
          
          $duration = 21300
          $startTime = Get-Date
          $lastLog = 0
          
          while ($true) {
              $elapsed = ((Get-Date) - $startTime).TotalSeconds
              if ($elapsed -ge $duration) { break }
              
              if ($ngrokProcess.HasExited) {
                  Write-Host "❌ Ngrok đã dừng! Khởi động lại..." -ForegroundColor Red
                  $ngrokProcess = Start-Process -FilePath ".\ngrok\ngrok.exe" `
                      -ArgumentList "tcp 3389 --region=$region --log=stdout" `
                      -NoNewWindow -PassThru
                  Start-Sleep -Seconds 10
              }
              
              if (($elapsed - $lastLog) -ge 900) {
                  $mins = [int]($elapsed/60)
                  $remain = [int](($duration - $elapsed)/60)
                  Write-Host "⏱️ Đã chạy: $mins phút | Còn lại: $remain phút"
                  $lastLog = $elapsed
              }
              
              Start-Sleep -Seconds 30
          }
          
          Write-Host "⏰ Hết 6 tiếng. Dọn dẹp..."
          Stop-Process -Id $ngrokProcess.Id -Force -ErrorAction SilentlyContinue
          Get-Process ngrok -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ Workflow hoàn tất!"
