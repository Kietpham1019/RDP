name: RDP-DucThangTechDzVPS-Windows-6Hours

on:
  workflow_dispatch:
    inputs:
      ngrok_download_url:
        description: 'Ngrok Windows (amd64) ZIP direct link'
        required: true
        default: 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip'
      ngrok_region:
        description: 'Ngrok Region (ap = Singapore, us = US, eu = Europe)'
        required: false
        default: 'ap'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Setup UTF-8 & Environment
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ErrorActionPreference = "Continue"
          Write-Host "✓ Environment sẵn sàng"

      # ============================================================
      # 1. DOWNLOAD NGROK
      # ============================================================
      - name: Download & Extract Ngrok
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "${{ github.event.inputs.ngrok_download_url }}" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath ngrok -Force
          Write-Host "✓ Ngrok đã sẵn sàng"

      - name: Authenticate Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if (-not $Env:NGROK_AUTH_TOKEN) {
            Write-Error "❌ Thiếu secret NGROK_AUTH_TOKEN!"
            exit 1
          }
          .\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
          Write-Host "✓ Ngrok đã xác thực"

      # ============================================================
      # 2. ĐỔI TÊN VPS & BẬT RDP
      # ============================================================
      - name: Đổi tên VPS & Kích hoạt RDP & Tạo User
        shell: pwsh
        run: |
          # ============ ĐỔI TÊN VPS ============
          $vpsName = "DucThangTechDzVPS"
          Write-Host "→ Đang đổi tên VPS thành: $vpsName"
          
          # Đổi ComputerName
          Rename-Computer -NewName $vpsName -Force -ErrorAction SilentlyContinue
          
          # Đổi tên hiển thị trong System Properties
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName" -Name "ComputerName" -Value $vpsName -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName" -Name "ComputerName" -Value $vpsName -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "Hostname" -Value $vpsName -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "NV Hostname" -Value $vpsName -Force -ErrorAction SilentlyContinue
          
          # Đổi tên hiển thị Windows (ProductName)
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" -Name "RegisteredOwner" -Value "DucThangTechDz" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" -Name "RegisteredOrganization" -Value "DucThangTechDz VPS" -Force -ErrorAction SilentlyContinue
          
          # Đổi EditionID để hiển thị đẹp (tuỳ chọn)
          # Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" -Name "EditionID" -Value "DucThangTechDzVPS" -Force -ErrorAction SilentlyContinue
          
          Write-Host "✓ Đã đổi tên VPS thành: $vpsName"
          
          # ============ BẬT RDP ==========
          $ErrorActionPreference = "Stop"

          try {
              # Bật RDP
              Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
                  -Name "fDenyTSConnections" -Value 0 -Force

              # Bật firewall rule cho RDP
              Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
                  Enable-NetFirewallRule -ErrorAction SilentlyContinue

              # ============ TẠO USER ============
              $username = "DucthengTechDz"
              $password = "W1nd0ws-P4ssw0rd-2026!"
              $secPass = ConvertTo-SecureString $password -AsPlainText -Force

              $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

              if ($null -eq $user) {
                  New-LocalUser -Name $username -Password $secPass `
                      -FullName $username -Description "RDP User" `
                      -PasswordNeverExpires -AccountNeverExpires | Out-Null
                  Write-Host "✓ Đã tạo user: $username"
              }
              else {
                  Set-LocalUser -Name $username -Password $secPass
                  Enable-LocalUser -Name $username
                  Write-Host "✓ User đã tồn tại - đã cập nhật password"
              }

              # ============ THÊM QUYỀN RDP ============
              $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"
              $rdpMember = Get-LocalGroupMember -Group $rdpGroup.Name -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match "\\$([regex]::Escape($username))$" }

              if ($null -eq $rdpMember) {
                  Add-LocalGroupMember -Group $rdpGroup.Name -Member $username
              }

              # ============ THÊM QUYỀN ADMIN ============
              $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"
              $adminMember = Get-LocalGroupMember -Group $adminGroup.Name -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match "\\$([regex]::Escape($username))$" }

              if ($null -eq $adminMember) {
                  Add-LocalGroupMember -Group $adminGroup.Name -Member $username
              }

              # ============ RDP SERVICE ============
              Set-Service -Name "TermService" -StartupType Automatic
              if ((Get-Service -Name "TermService").Status -ne "Running") {
                  Start-Service -Name "TermService"
              }

              # ============ KIỂM TRA ============
              $checkUser = Get-LocalUser -Name $username -ErrorAction Stop
              if (-not $checkUser.Enabled) {
                  throw "User $username đang bị Disabled."
              }

              $rdpValue = (Get-ItemProperty `
                  -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
                  -Name "fDenyTSConnections").fDenyTSConnections

              if ($rdpValue -ne 0) {
                  throw "Không bật được RDP (fDenyTSConnections=$rdpValue)."
              }

              Write-Host "✓ RDP đã bật - User: $username / Pass: $password"
              Write-Host "✓ VPS Name: $vpsName"
          }
          catch {
              Write-Host "❌ LỖI BƯỚC RDP/USER: $($_.Exception.Message)" -ForegroundColor Red
              Write-Host "Chi tiết: $($_.ScriptStackTrace)" -ForegroundColor Yellow
              exit 1
          }

     
          # ---------- TCP REGISTRY - GIẢM DELAY ----------
          $tcp = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters"
          $tcpIf = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces"
          
          Set-ItemProperty -Path $tcp -Name "TcpAckFrequency" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TCPNoDelay" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TcpDelAckTicks" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TcpWindowSize" -Value 65535 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "Tcp1323Opts" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "DefaultTTL" -Value 64 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "EnableTCPA" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tcp -Name "MaxUserPort" -Value 65534 -Type DWord -Force
          Set-ItemProperty -Path $tcp -Name "TcpTimedWaitDelay" -Value 30 -Type DWord -Force
          
          # Áp dụng cho TẤT CẢ network interfaces
          Get-ChildItem $tcpIf -ErrorAction SilentlyContinue | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name "TcpAckFrequency" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "TCPNoDelay" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "TcpDelAckTicks" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          
          # ---------- QoS CHO RDP ----------
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Version" -Value "1.0" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Application Name" -Value "*.exe" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Protocol" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Local Port" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Local IP" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Remote Port" -Value "3389" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Remote IP" -Value "*" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "DSCP Value" -Value "46" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\QoS\RDP" -Name "Throttle Rate" -Value "-1" -Type String -Force
          
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Psched" -Name "NonBestEffortLimit" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          
          # ---------- MULTIMEDIA NETWORK THROTTLING ----------
          $mmPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          Set-ItemProperty -Path $mmPath -Name "NetworkThrottlingIndex" -Value 0xffffffff -Type DWord -Force
          Set-ItemProperty -Path $mmPath -Name "SystemResponsiveness" -Value 0 -Type DWord -Force
          
          $netTasks = @("Audio", "Video", "Games", "Low Latency", "Pro Audio", "Window Manager", "Capture", "DisplayPostProcessing", "Playback")
          foreach ($task in $netTasks) {
              $p = "$mmPath\Tasks\$task"
              if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
              Set-ItemProperty -Path $p -Name "Scheduling Category" -Value "High" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $p -Name "SFIO Priority" -Value "High" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $p -Name "Priority" -Value 6 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $p -Name "GPU Priority" -Value 8 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          
          # ---------- DISABLE DEFENDER NETWORK INSPECTION ----------
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableRealtimeMonitoring" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableBehaviorMonitoring" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableScanOnRealtimeEnable" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet" -Name "SpynetReporting" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # Giữ Windows Firewall hoạt động để bảo vệ RDP.
          
          # ---------- DNS TỐI ƯU ----------
          $adapters = Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq "Up" }
          foreach ($adapter in $adapters) {
              Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses ("1.1.1.1", "8.8.8.8", "1.0.0.1") -ErrorAction SilentlyContinue
          }
          
          # ---------- DISABLE NETWORK SERVICES NGỐN TÀI NGUYÊN ----------
          $netServices = @("SNMPTRAP", "SNMP", "RemoteAccess", "SharedAccess", "WlanSvc")
          foreach ($svc in $netServices) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          Write-Host "✓ Đã tối ưu mạng - Zero Delay đã bật"

     

      # ============================================================
      # 9. START NGROK & KEEP-ALIVE 6H
      # ============================================================
      - name: Start Ngrok & Keep-Alive (6 Hours)
        shell: pwsh
        run: |
          Write-Host "======================================================================"
          Write-Host "  🖥️  VPS: DucThangTechDzVPS"
          Write-Host "  🚀 WINDOWS - RDP OPTIMIZED"
          Write-Host "======================================================================"
          Write-Host "  Tài khoản : DucthengTechDz"
          Write-Host "  Mật khẩu  : W1nd0ws-P4ssw0rd-2026!"
          Write-Host "  VPS Name  : DucThangTechDzVPS"
          Write-Host "  Region    : ${{ github.event.inputs.ngrok_region }} (Singapore)"
          Write-Host "  Tối ưu    : Network Zero-Lag, RDP Zero-Lag, QoS, TCP NoDelay"
          Write-Host "  Thời gian : 6 TIẾNG (360 PHÚT)"
          Write-Host "======================================================================"
          
          $region = "${{ github.event.inputs.ngrok_region }}"
          
          $ngrokProcess = Start-Process -FilePath ".\ngrok\ngrok.exe" `
              -ArgumentList "tcp 3389 --region=$region --log=stdout --log-format=json" `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput "$env:TEMP\ngrok_out.log" `
              -RedirectStandardError "$env:TEMP\ngrok_err.log"
          
          Write-Host "⏳ Đợi Ngrok khởi động..."
          Start-Sleep -Seconds 15
          
          $publicUrl = $null
          for ($i = 0; $i -lt 5; $i++) {
              try {
                  $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
                  $publicUrl = $tunnels.tunnels[0].public_url
                  if ($publicUrl) { break }
              } catch { }
              Start-Sleep -Seconds 5
          }
          
          if ($publicUrl) {
              Write-Host "======================================================================"
              Write-Host "  🌐 ĐỊA CHỈ RDP: $publicUrl" -ForegroundColor Green
              Write-Host "  📌 Copy phần sau 'tcp://' vào Remote Desktop" -ForegroundColor Yellow
              Write-Host "  📌 Hoặc dùng: $($publicUrl -replace 'tcp://', '')" -ForegroundColor Yellow
              Write-Host "======================================================================"
          } else {
              Write-Host "⚠️ Không lấy được URL. Log Ngrok:"
              Get-Content "$env:TEMP\ngrok_out.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
          
          Write-Host "🕐 Bắt đầu giữ kết nối 6 tiếng..."
          
          $duration = 21600
          $startTime = Get-Date
          $lastLog = 0
          
          while ($true) {
              $elapsed = ((Get-Date) - $startTime).TotalSeconds
              if ($elapsed -ge $duration) { break }
              
              if ($ngrokProcess.HasExited) {
                  Write-Host "❌ Ngrok đã dừng! Khởi động lại..." -ForegroundColor Red
                  $ngrokProcess = Start-Process -FilePath ".\ngrok\ngrok.exe" `
                      -ArgumentList "tcp 3389 --region=$region --log=stdout" `
                      -NoNewWindow -PassThru
                  Start-Sleep -Seconds 10
              }
              
              if (($elapsed - $lastLog) -ge 900) {
                  $mins = [int]($elapsed/60)
                  $remain = [int](($duration - $elapsed)/60)
                  Write-Host "⏱️ Đã chạy: $mins phút | Còn lại: $remain phút"
                  $lastLog = $elapsed
              }
              
              Start-Sleep -Seconds 30
          }
          
          Write-Host "⏰ Hết 6 tiếng. Dọn dẹp..."
          Stop-Process -Id $ngrokProcess.Id -Force -ErrorAction SilentlyContinue
          Get-Process ngrok -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ Workflow hoàn tất!”
